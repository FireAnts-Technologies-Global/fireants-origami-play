plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

apply from: 'variants-signing.gradle'

def buildConfigString = { String propertyName ->
    def value = providers.gradleProperty(propertyName).getOrElse("")
    "\"${value}\""
}

android {
    compileSdk compile_sdk_version

    defaultConfig {
        applicationId "com.pegas.origami.paper.folding.art"
        minSdkVersion min_sdk_version
        targetSdk target_sdk_version
        versionCode 100
        versionName "1.0.0"

        def formattedDate = new Date().format('MM.dd.yyyy')
        archivesBaseName = "FireAnts_Base_Project_v${versionName}_v${versionCode}_${formattedDate}"

        buildConfigField "String", "FIREANTS_ADS_VERSION", "\"$fireants_ads_sdk\""
        buildConfigField "String", "PLAY_SERVICES_ADS_VERSION", "\"$play_services_ads_version\""
        buildConfigField "String", "GDPR_MODULE_VERSION", "\"$fireants_consent\""
        buildConfigField "String", "REVENUECAT_API_KEY", buildConfigString("revenuecat.apiKey")
        buildConfigField "String", "REVENUECAT_ENTITLEMENT_PREMIUM", buildConfigString("revenuecat.entitlementPremium")
        buildConfigField "String", "REVENUECAT_OFFERING_DEFAULT", buildConfigString("revenuecat.offeringDefault")
        buildConfigField "String", "REVENUECAT_PACKAGE_WEEKLY", buildConfigString("revenuecat.packageWeekly")
        buildConfigField "String", "REVENUECAT_PACKAGE_MONTHLY", buildConfigString("revenuecat.packageMonthly")
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        def BOOLEAN = "boolean"
        def TRUE = "true"
        def FALSE = "false"
        def DEV_MODE = "DEV_MODE"

        debug {
            buildConfigField "String", "email_feedback", "\"longtq2609@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-3940256099942544~3347511713"]
            buildConfigField "Boolean", "build_debug", "true"
            buildConfigField(BOOLEAN, DEV_MODE, TRUE)
            versionNameSuffix '-dev'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        release {
            buildConfigField "String", "email_feedback", "\"longtq2609@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-7988764211742191~6692895226"]
            buildConfigField "Boolean", "build_debug", "false"
            buildConfigField(BOOLEAN, DEV_MODE, FALSE)
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }
    namespace 'com.pegas.origami.paper.folding.art'
}

dependencies {
    implementation 'com.fireants:dev-config:1.0.1'
    implementation "com.fireants:consent:$fireants_consent"
    implementation "com.fireants:ads:$fireants_ads_sdk"

    // Local AAR modules
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // AndroidX Core
    implementation "androidx.core:core-ktx:$androidx_core_ktx_version"
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.recyclerview:recyclerview:$androidx_recyclerview_version"
    implementation "androidx.multidex:multidex:$androidx_multidex_version"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    // Moshi
    ksp "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"
    implementation "com.squareup.moshi:moshi:$moshi_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "com.squareup.moshi:moshi-adapters:$moshi_version"

    // Coroutine
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:compiler:$glide_version"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Timber
    implementation "com.jakewharton.timber:timber:$timber_version"

    // Permissions
    implementation "io.github.impeterwayne:xxpermission-ktx:$xxpermission_ktx_version"

    // UI Libraries
    implementation "de.hdodenhof:circleimageview:$circleimageview_version"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'

    // Ads
    implementation "com.google.android.play:review-ktx:$play_review_ktx_version"
    implementation "com.facebook.shimmer:shimmer:$shimmer_version"
    implementation "com.google.android.gms:play-services-ads:$play_services_ads_version"

    // Billing
    implementation "com.android.billingclient:billing:$billing_version"
    implementation 'com.revenuecat.purchases:purchases:10.15.1'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation "androidx.fragment:fragment-ktx:$androidx_fragment_ktx_version"

    // Lottie
    implementation "com.airbnb.android:lottie:$lottie_version"

    // Rate
    implementation "com.github.ome450901:SimpleRatingBar:$simpleratingbar_version"

    // Media
    implementation "androidx.media3:media3-exoplayer:$media3_exoplayer_version"
    implementation "androidx.media3:media3-ui:$media3_ui_version"

    // BlurView
    implementation "com.github.Dimezis:BlurView:$blurview_version"

    // ShapeView
    implementation 'io.github.impeterwayne:shape-view:1.0.0'

    testImplementation 'junit:junit:4.13.2'
}
